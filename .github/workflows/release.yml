name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file wget \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev rpm

      - name: Install Windows bundler tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset nsis -y --no-progress

      # 注意：不能仅用 go-version-file 读取 server/go.mod 的 `go 1.24.0`。
      # Go 1.24 的 TLS ClientHello 指纹会被 LeetCode 前的 Cloudflare 判定为
      # 爬虫并返回 403（Just a moment...）。固定到已验证的 Go 1.26.8，避免
      # go-version 使用浮动 patch 版本导致构建产物的 TLS 指纹变化。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Go sidecar
        run: bash scripts/build-sidecar.sh "${{ matrix.target }}"

      - name: Build desktop bundles
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npx tauri build --target "${{ matrix.target }}"

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1

      - name: Stage release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ runner.os }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir -p release-assets
          case "$PLATFORM" in
            macOS)
              find "$bundle" -type f -name '*.dmg' -exec cp {} release-assets/ \;
              ;;
            Windows)
              find "$bundle" -type f \( -name '*.msi' -o -name '*.exe' \) -exec cp {} release-assets/ \;
              ;;
            Linux)
              find "$bundle" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/ \;
              ;;
          esac
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="docs/update/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            printf 'LeetCode Note %s release.\n' "$TAG" > release-notes.md
            NOTES=release-notes.md
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" --notes-file "$NOTES"
          fi
